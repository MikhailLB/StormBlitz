name: storm_blitz
description: "Storm Blitz - Council of Olympus card tactics game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.5+1

  # Local persistence
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # Web content shell
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.9.0
  webview_flutter_wkwebview: ^3.24.0

  # Attribution + telemetry
  appsflyer_sdk: ^6.17.0
  app_tracking_transparency: ^2.0.6

  # Push
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.7
  firebase_app_check: ^0.3.2+9
  flutter_local_notifications: ^18.0.1

  # Networking
  http: ^1.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  image_path_ios: "assets/icon.png"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Firebase managed via CocoaPods — avoid SPM module redefinition.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/
